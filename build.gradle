plugins {
    id 'fabric-loom' version "${loom_version}"
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

loom {
    accessWidenerPath = file("src/main/resources/betternether.accesswidener")
    runs {
        // This adds a new gradle task that runs the datagen API: "gradlew runDatagenClient"
        datagenClient {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.strict-validation"
            vmArg "-Dfabric-api.datagen.modid=${project.mod_id}"

            runDir "build/datagen"
        }
    }

    if (findProject(':WorldWeaver') != null || findProject(':wunderlib') != null || findProject(':BCLib') != null) {
        enableTransitiveAccessWideners = true
    }
}

sourceSets {
    main {
        // Add the datagenned files into the jar.
        resources {
            srcDirs += [
                    'src/main/generated'
            ]
        }
    }
    // Test-only mod. Never shipped: it is its own fabric mod (see src/testmod/resources/fabric.mod.json)
    // and is only ever put on the classpath by the `gametest` run below, so nothing here ends up in
    // the release jar. Mirrors WorldWeaver's per-module testmod source set (WorldWeaver/common.gradle).
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    runs {
        // Headless Fabric GameTest run: boots a dedicated server, executes every @GameTest in
        // src/testmod, writes a JUnit-style report.xml and exits non-zero if any test failed.
        // Usage: `./gradlew :runGametest` (the leading colon matters - without it the task name also
        // matches the runGametest tasks of every included WorldWeaver module).
        gametest {
            server()
            name "GameTest"
            runDir "build/gametest"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${file("build/gametest/report.xml")}"
            source sourceSets.testmod
            ideConfigGenerated true
        }
    }

    // Loom 1.15 dropped the mod*-prefixed configurations, so source-set-to-mod mapping is explicit
    // (see the note at the top of common-settings.gradle). The testmod has to be its own mod entry or
    // the loader would see two fabric.mod.json files on a single mod path.
    mods {
        register(project.mod_id) {
            sourceSet sourceSets.main
        }
        register("${project.mod_id}-testmod") {
            sourceSet sourceSets.testmod
        }
    }
}

dependencies {
    // The testmod compiles and runs against the mod itself.
    testmodImplementation sourceSets.main.output

    // wover-test-api is purely GameTest support (mock players, registry/trait sweeps) shared with
    // BetterEnd's testmod - deliberately testmod-only, not part of the knownWoverModules loop below,
    // so it never becomes a runtime dependency of the shipped mod jar.
    if (findProject(':WorldWeaver') != null) {
        testmodImplementation project(path: ":WorldWeaver:wover-test-api", configuration: 'dev')
        testmodImplementation project(path: ":WorldWeaver:wover-test-api", configuration: 'devClient')
    } else {
        testmodImplementation "org.betterx:worldweaver:${project.wover_version}"
    }
}

subprojects { subproject ->
    subproject.tasks.withType(Javadoc) { javadocTask ->
        javadocTask.failOnError false
        javadocTask.enabled = false
    }

    subproject.tasks.withType(Jar) { jarTask ->
        if (jarTask.name == 'javadocJar') {
            jarTask.enabled = false
        }
    }
}

dependencies {
    //to change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // https://mvnrepository.com/artifact/javax.annotation/jsr305
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'


    // compile against the API
    modCompileOnly "mcp.mobius.waila:wthit-api:fabric-${project.wthit_version}"

    // run against the full jar
    modRuntimeOnly "mcp.mobius.waila:wthit:fabric-${project.wthit_version}"

    // alsoInclude=false: BetterNether doesn't bundle BCLib into its own jar.
    gradle.modApiOrLocal(dependencies, ':BCLib', "org.betterx:bclib:${project.bclib_version}", false)

    // EMI 1.1.8+1.21 targets 1.21.1 and its mixins fail against 1.21.7; the BetterNether EMI
    // integration is disabled for now (see integrations/emi, entrypoint emi_disabled). Re-enable
    // with an EMI build for 1.21.7.
//    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
//    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

    modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}" // compile against the API
    modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}" // run against the full jar

    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

    // alsoInclude=false: BetterNether doesn't bundle wunderlib into its own jar.
    gradle.modApiOrLocal(dependencies, ':wunderlib', "de.ambertation:wunderlib:${project.wunderlib_version}", false)

    if (findProject(':WorldWeaver') != null) {
        // 'localDev' (not 'dev') because it bundles the packaged jar, which includes the root
        // WorldWeaver project's own client classes (e.g. ModMenuEntryPoint) - 'dev' only exposes
        // sourceSets.main.output, so 'dev' alone would silently drop client-only entrypoints.
        implementation project(path: ":WorldWeaver", configuration: 'localDev')

        // wover-test-api is left out of this loop: it's testmod-only GameTest support, wired
        // separately as testmodImplementation above. That removes the direct top-level dependency
        // edges and records the intent, but it is not a containment guarantee - the ':WorldWeaver'
        // root aggregate pulled in just above depends on every module, wover-test-api included, so
        // it still reaches this mod's dependency graph transitively (visible in ./gradlew
        // :dependencies as project :WorldWeaver > project :WorldWeaver:wover-test-api).
        (gradle.knownWoverModules - ['wover-test-api']).each {
            implementation project(path: ":WorldWeaver:$it", configuration: 'dev')
            // BetterNether doesn't split its own client/common sources, so its single sourceSet needs
            // each wover module's client output too (WorldWeaver itself now enforces the split - see
            // WorldWeaver/common.gradle's devClient configuration).
            implementation project(path: ":WorldWeaver:$it", configuration: 'devClient')
        }
    } else {
        modImplementation "org.betterx:worldweaver:${project.wover_version}"
    }

    // Plain JUnit 5 unit tests (`src/test/java`, run via `./gradlew test`). Mirrors WorldWeaver's
    // convention (see WorldWeaver/TESTING.md): pure-logic tests that need no running world/registries.
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation sourceSets.main.output
    // ASM tree API to statically inspect compiled bytecode (see StructurePieceThreadSafetyAuditTest) -
    // already on the buildscript classpath transitively via Loom/Mixin, but declared explicitly here so
    // the test compiles/runs reproducibly instead of relying on an incidental transitive edge.
    testImplementation "org.ow2.asm:asm:9.7"
    testImplementation "org.ow2.asm:asm-tree:9.7"
}


repositories {
    mavenCentral()
    //mavenLocal()
    maven { url 'https://maven.blamejared.com' }
    maven { url 'https://jitpack.io' }
    maven { url "https://maven.bai.lol" }
    maven { url 'https://maven.terraformersmc.com' }
    maven { url 'https://maven.ambertation.de/releases' }
    flatDir {
        dirs 'libs'
    }
}

// src/main/resources and src/main/generated are both in the resources source set, so a file present in
// both is packed twice. The duplicatesStrategy below keeps that from breaking the build, but it must not
// be the answer: which copy wins depends on source-dir ordering, and the copies are usually NOT the same
// file - a datagen fallback that restates a hand-authored asset is generally the worse (or broken) one.
// Duplicates are therefore a bug in the providers and get fixed there; this task makes them visible
// instead of letting a silent EXCLUDE decide.
tasks.register("checkDuplicateAssets") {
    description = "Fails if src/main/generated restates a file from src/main/resources."
    group = "verification"

    def handAuthored = file("src/main/resources")
    def generated = file("src/main/generated")
    inputs.dir(handAuthored).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(generated).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.upToDateWhen { true }

    doLast {
        def relative = { root ->
            fileTree(root).files.collect { root.toPath().relativize(it.toPath()).toString() } as Set
        }
        def dupes = new TreeSet<String>(relative(handAuthored))
        dupes.retainAll(relative(generated))
        dupes.remove(".DS_Store")

        if (!dupes.isEmpty()) {
            throw new GradleException(
                    "${dupes.size()} generated asset(s) restate a hand-authored file in src/main/resources.\n" +
                            "Fix the datagen provider so it stops emitting these, rather than relying on\n" +
                            "processResources' duplicatesStrategy to pick a winner:\n" +
                            dupes.collect { "  - $it" }.join("\n")
            )
        }
    }
}
check.dependsOn("checkDuplicateAssets")

processResources {
    // Safety net only - src/main/generated is appended after src/main/resources, so EXCLUDE keeps the
    // first (hand-authored) copy. Any duplicate that reaches this point is a bug; checkDuplicateAssets
    // above is what actually reports it.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // block_properties.txt is a committed property-audit snapshot (see BlockPropertiesProvider); it lives in
    // the resources source set so git tracks it, but it is not a runtime asset - keep it out of the jar.
    exclude 'block_properties.txt'
    exclude 'block_registrations.txt'
    exclude 'item_registrations.txt'
    exclude 'block_shapes.txt'
    println "Version: ${project.version}"
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    it.options.release = 21
}

// JUnit 5 for `src/test/java`. Give the test source set access to the (named/Mojmap) Minecraft
// classpath from `main` so tests that touch mod/Minecraft classes can load them (see
// StructurePieceThreadSafetyAuditTest, which needs CityPiece/DestructionPiece and StructurePiece on
// the classpath, though it never boots the game).
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
// if it is present.
// If you remove this task, sources will not be generated.
task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = "sources"
    // src/main/generated is part of the resources source set and can restate a hand-authored file;
    // keep the first (hand-authored) copy, same rule as processResources.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Same property-audit snapshot as processResources - committed, but not shipped in the sources jar.
    exclude 'block_properties.txt'
    exclude 'block_registrations.txt'
    exclude 'item_registrations.txt'
    exclude 'block_shapes.txt'
    from sourceSets.main.allSource
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from "LICENSE"
    from "LICENSE.ASSETS"
}

apply from: "common-helper.gradle"
apply from: "compat-test.gradle"
apply from: "common-publish-tag.gradle"

allprojects {
    // Allow 400 errors.
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "5000"
        }
    }
}
