# Parent of the FIRST commit on release/26.2, so it reads as a diff instead of a full
# import; later releases sit on the previous release commit. Everything reachable
# from this ref becomes part of the public release branch - only ever point it at
# the previous release branch, or at 1.21.6 for 26.1, never at a 26.x dev branch.
